on:
  push:
    tags:
      - 'opencode-pushnot-v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - run: pnpm install
      - run: pnpm build
        working-directory: packages/opencode-pushnot
      - run: pnpm stage publish --no-git-checks
        working-directory: packages/opencode-pushnot
